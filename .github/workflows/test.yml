name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

      # Builds the .app and verifies it carries every SwiftPM resource bundle.
      # A dependency that ships resources traps at runtime if the bundle is not
      # in the .app, and neither `swift build` nor `swift test` can see that —
      # so this runs on every PR, including Dependabot bumps. See docs/adr/010.
      - name: Build and verify app bundle
        run: ./Scripts/bundle.sh
